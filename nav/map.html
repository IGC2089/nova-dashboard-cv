<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Navigation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* Vehicle icon — always pointing up since map rotates to heading-up */
    #vehicle {
      position: fixed;
      left: 50%;
      top: 66.6%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 10;
    }
    #vehicle svg {
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
    }

    /* No-fix overlay */
    #no-fix {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      color: #EBB32B;
      font: bold 1.2rem 'Arial', sans-serif;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.15em;
      z-index: 20;
    }
    #no-fix.visible { display: flex; }

    /* Speed badge — hidden; speed is shown in the left gauge */
    #speed { display: none; }

    /* Home button */
    #home-btn {
      position: fixed;
      top: 16px;
      left: 208px;
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.65);
      border: 1px solid #a2abbb;
      border-radius: 50%;
      color: #a2abbb;
      font-size: 18px;
      cursor: pointer;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Search button */
    #search-btn {
      position: fixed;
      top: 16px;
      right: 208px;
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.65);
      border: 1px solid #a2abbb;
      border-radius: 50%;
      color: #a2abbb;
      font-size: 20px;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Search panel + keyboard */
    #search-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 30;
      flex-direction: column;
      align-items: stretch;
    }
    #search-panel.visible { display: flex; }

    #search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 2px solid #EBB32B;
    }
    #search-input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1.2rem;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: #fff;
      outline: none;
      caret-color: #EBB32B;
    }
    #search-go {
      padding: 12px 22px;
      background: #EBB32B;
      color: #000;
      border: none;
      border-radius: 6px;
      font: bold 1.1rem 'Arial', sans-serif;
      cursor: pointer;
    }
    #search-close {
      padding: 12px 16px;
      background: none;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* On-screen keyboard */
    #osk {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
    }
    .osk-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    .osk-key {
      flex: 1;
      max-width: 68px;
      height: 52px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .osk-key:active { background: #EBB32B; color: #000; }
    .osk-key.wide { max-width: 110px; font-size: 0.9rem; }
    .osk-key.space { max-width: 300px; }
    .osk-key.accent { background: #333; color: #EBB32B; }

    /* Turn banner — offset right of left gauge */
    #turn-banner {
      display: none;
      position: fixed;
      top: 0; left: 200px; right: 200px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font: bold 1.1rem 'Arial', sans-serif;
      padding: 12px 16px;
      z-index: 15;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #a2abbb;
    }
    #turn-banner.visible { display: flex; }
    #turn-instruction { flex: 1; }
    #turn-distance { color: #a2abbb; white-space: nowrap; font-size: 1.2rem; }
    #cancel-route {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* ---- BMW cluster gauge panels ---- */
    #gauge-left, #gauge-right {
      position: fixed;
      top: 0;
      width: 200px;
      height: 480px;
      pointer-events: none;
      z-index: 12;
    }
    #gauge-left  { left: 0; }
    #gauge-right { right: 0; }

    /* Bottom cluster bar */
    #cluster-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(10,10,15,0.88);
      border-top: 1px solid #1e2530;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 13;
      pointer-events: none;
      font-family: Arial, sans-serif;
    }
    .cluster-cell {
      display: flex;
      align-items: baseline;
      gap: 5px;
      min-width: 120px;
    }
    .cluster-cell.center { justify-content: center; }
    .cluster-cell.right  { justify-content: flex-end; }
    .cluster-val {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
    }
    .cluster-unit {
      font-size: 0.75rem;
      color: #a2abbb;
      letter-spacing: 0.05em;
    }
    #bottom-clock { color: #a2abbb; font-size: 1.1rem; font-weight: bold; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Amber arrow — always pointing up since map rotates to heading-up -->
  <div id="vehicle">
    <svg width="36" height="48" viewBox="0 0 36 48">
      <polygon points="18,0 36,48 18,36 0,48" fill="#EBB32B" stroke="#000" stroke-width="1.5"/>
    </svg>
  </div>

  <div id="no-fix">NO GPS FIX</div>
  <div id="speed">-- km/h</div>

  <!-- Home button — returns to dashboard workspace -->
  <button id="home-btn" onclick="goHome()">&#8962;</button>

  <!-- Search button (hidden while routing) -->
  <button id="search-btn" onclick="openSearch()">&#9906;</button>

  <!-- Search panel with built-in keyboard -->
  <div id="search-panel">
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Type destination…" autocomplete="off" readonly/>
      <button id="search-go" onclick="doSearch()">Go</button>
      <button id="search-close" onclick="closeSearch()">&#x2715;</button>
    </div>
    <div id="osk">
      <div class="osk-row">
        <div class="osk-key" onclick="oskKey('q')">q</div><div class="osk-key" onclick="oskKey('w')">w</div><div class="osk-key" onclick="oskKey('e')">e</div><div class="osk-key" onclick="oskKey('r')">r</div><div class="osk-key" onclick="oskKey('t')">t</div><div class="osk-key" onclick="oskKey('y')">y</div><div class="osk-key" onclick="oskKey('u')">u</div><div class="osk-key" onclick="oskKey('i')">i</div><div class="osk-key" onclick="oskKey('o')">o</div><div class="osk-key" onclick="oskKey('p')">p</div>
      </div>
      <div class="osk-row">
        <div class="osk-key" onclick="oskKey('a')">a</div><div class="osk-key" onclick="oskKey('s')">s</div><div class="osk-key" onclick="oskKey('d')">d</div><div class="osk-key" onclick="oskKey('f')">f</div><div class="osk-key" onclick="oskKey('g')">g</div><div class="osk-key" onclick="oskKey('h')">h</div><div class="osk-key" onclick="oskKey('j')">j</div><div class="osk-key" onclick="oskKey('k')">k</div><div class="osk-key" onclick="oskKey('l')">l</div>
      </div>
      <div class="osk-row">
        <div class="osk-key" onclick="oskKey('z')">z</div><div class="osk-key" onclick="oskKey('x')">x</div><div class="osk-key" onclick="oskKey('c')">c</div><div class="osk-key" onclick="oskKey('v')">v</div><div class="osk-key" onclick="oskKey('b')">b</div><div class="osk-key" onclick="oskKey('n')">n</div><div class="osk-key" onclick="oskKey('m')">m</div><div class="osk-key accent wide" onclick="oskBackspace()">&#9003;</div>
      </div>
      <div class="osk-row">
        <div class="osk-key accent wide" onclick="oskKey('1')">1</div><div class="osk-key accent wide" onclick="oskKey('2')">2</div><div class="osk-key accent wide" onclick="oskKey('3')">3</div><div class="osk-key accent wide" onclick="oskKey('4')">4</div><div class="osk-key accent wide" onclick="oskKey('5')">5</div><div class="osk-key accent wide" onclick="oskKey('6')">6</div><div class="osk-key accent wide" onclick="oskKey('7')">7</div><div class="osk-key accent wide" onclick="oskKey('8')">8</div><div class="osk-key accent wide" onclick="oskKey('9')">9</div><div class="osk-key accent wide" onclick="oskKey('0')">0</div>
      </div>
      <div class="osk-row">
        <div class="osk-key accent wide" onclick="oskKey(',')">','</div><div class="osk-key space" onclick="oskKey(' ')">space</div><div class="osk-key accent wide" onclick="oskKey('.')">.</div><div class="osk-key accent wide" onclick="oskKey('-')">-</div>
      </div>
    </div>
  </div>

  <!-- Turn-by-turn banner -->
  <div id="turn-banner">
    <span id="turn-instruction"></span>
    <span id="turn-maneuver" style="display:flex;align-items:center;flex-shrink:0"></span>
    <span id="turn-distance"></span>
    <span id="turn-eta" style="color:#aaa;font-size:0.95rem;white-space:nowrap"></span>
    <button id="cancel-route" onclick="cancelRoute()">&#x2715; End</button>
  </div>

  <!-- BMW cluster gauges -->
  <canvas id="gauge-left"  width="200" height="480"></canvas>
  <canvas id="gauge-right" width="200" height="480"></canvas>

  <!-- Bottom status bar -->
  <div id="cluster-bottom">
    <div class="cluster-cell">
      <span id="bottom-clock">--:--</span>
    </div>
    <div class="cluster-cell center">
      <span class="cluster-val" id="bottom-speed">--</span>
      <span class="cluster-unit">km/h</span>
    </div>
    <div class="cluster-cell right">
      <span class="cluster-val" id="bottom-temp">--</span>
      <span class="cluster-unit">°C</span>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    var MAPS_KEY = '{{API_KEY}}';
    var map;
    var lastPos = null;
    var mapReady = false;
    var gpsChannel = null;
    var routePolyline = null;
    var routeSteps = [];
    var routeEta = null;

    // ------------------------------------------------------------------ map init
    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 17,
        center: { lat: 0, lng: 0 },
        mapTypeId: 'roadmap',
        disableDefaultUI: true,
        gestureHandling: 'none',
        keyboardShortcuts: false,
        backgroundColor: '#1a1a1a',
        styles: [
          { featureType: 'poi', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit', stylers: [{ visibility: 'off' }] },
          { elementType: 'labels.icon', stylers: [{ visibility: 'off' }] }
        ]
      });
      mapReady = true;
      if (lastPos) applyPosition(lastPos);
    }

    // ------------------------------------------------------------------ BMW gauge drawing

    var SPEED_MAX = 330;
    var RPM_MAX   = 7000;
    // Speed labeled ticks (km/h)
    var SPEED_TICKS = [330, 270, 210, 150, 120, 90, 60, 30, 0];
    // RPM labeled ticks (rpm value, label string)
    var RPM_TICKS = [
      [7000, '7'], [6000, '6'], [5000, '5'], [4000, '4'],
      [3000, '3'], [2000, '2'], [1000, '1'], [0, '']
    ];
    var TOP_PAD = 36, BOT_PAD = 52; // vertical padding inside gauge

    function drawSpeedCanvas(speedKph) {
      var canvas = document.getElementById('gauge-left');
      var ctx = canvas.getContext('2d');
      var W = 200, H = 480;
      var drawH = H - TOP_PAD - BOT_PAD;

      // Background
      ctx.fillStyle = 'rgba(10,10,15,0.90)';
      ctx.fillRect(0, 0, W, H);

      // Right-edge separator line
      ctx.strokeStyle = '#1e2530';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W - 1, 0);
      ctx.lineTo(W - 1, H);
      ctx.stroke();

      var fillFrac = Math.max(0, Math.min(1, speedKph / SPEED_MAX));

      // Gradient fill bar — 8px wide strip along right edge
      var barX = W - 22;
      var barW = 8;
      var barTop = TOP_PAD + drawH * (1 - fillFrac);
      var barBot = TOP_PAD + drawH;

      if (fillFrac > 0) {
        var grad = ctx.createLinearGradient(0, barBot, 0, barTop);
        grad.addColorStop(0, '#0a3050');
        grad.addColorStop(1, '#77CEF5');
        ctx.fillStyle = grad;
        ctx.fillRect(barX, barTop, barW, barBot - barTop);
      }
      // Empty portion of bar
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(barX, TOP_PAD, barW, barTop - TOP_PAD);

      // Tick marks — on the right side, pointing left into the panel
      ctx.textAlign = 'right';
      SPEED_TICKS.forEach(function(level) {
        var frac = level / SPEED_MAX;
        var y = TOP_PAD + drawH * (1 - frac);
        var isMajor = (level % 30 === 0);
        var tickLen = isMajor ? 18 : 8;
        var active = level <= speedKph;

        ctx.strokeStyle = active ? '#77CEF5' : '#3a4555';
        ctx.lineWidth = isMajor ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(barX - 2, y);
        ctx.lineTo(barX - 2 - tickLen, y);
        ctx.stroke();

        if (isMajor && level > 0) {
          ctx.font = '11px Arial';
          ctx.fillStyle = active ? '#77CEF5' : '#3a4555';
          ctx.fillText(String(level), barX - 2 - tickLen - 4, y + 4);
        }
      });

      // "0" label at bottom
      ctx.font = '11px Arial';
      ctx.fillStyle = speedKph < 5 ? '#77CEF5' : '#3a4555';
      ctx.fillText('0', barX - 2 - 18 - 4, TOP_PAD + drawH + 4);

      // Large speed value
      ctx.textAlign = 'center';
      ctx.font = 'bold 54px Arial';
      ctx.fillStyle = '#77CEF5';
      ctx.fillText(Math.round(speedKph), 84, H / 2 + 10);

      // "km/h" unit label
      ctx.font = '13px Arial';
      ctx.fillStyle = '#a2abbb';
      ctx.fillText('km/h', 84, H / 2 + 32);

      // "SPD" header
      ctx.font = 'bold 11px Arial';
      ctx.fillStyle = '#a2abbb';
      ctx.letterSpacing = '0.1em';
      ctx.fillText('SPD', 84, TOP_PAD - 14);
    }

    function drawRpmCanvas(rpm) {
      var canvas = document.getElementById('gauge-right');
      var ctx = canvas.getContext('2d');
      var W = 200, H = 480;
      var drawH = H - TOP_PAD - BOT_PAD;

      // Background
      ctx.fillStyle = 'rgba(10,10,15,0.90)';
      ctx.fillRect(0, 0, W, H);

      // Left-edge separator line
      ctx.strokeStyle = '#1e2530';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, H);
      ctx.stroke();

      var fillFrac = Math.max(0, Math.min(1, rpm / RPM_MAX));
      var redline = rpm >= 6000;

      // Gradient fill bar — 8px wide strip along left edge
      var barX = 14;
      var barW = 8;
      var barTop = TOP_PAD + drawH * (1 - fillFrac);
      var barBot = TOP_PAD + drawH;

      if (fillFrac > 0) {
        var grad = ctx.createLinearGradient(0, barBot, 0, barTop);
        grad.addColorStop(0, '#3a0505');
        grad.addColorStop(redline ? 0.5 : 1, '#F16666');
        if (redline) grad.addColorStop(1, '#ff2020');
        ctx.fillStyle = grad;
        ctx.fillRect(barX, barTop, barW, barBot - barTop);
      }
      // Empty portion of bar
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(barX, TOP_PAD, barW, barTop - TOP_PAD);

      // Tick marks — on the left side, pointing right into the panel
      ctx.textAlign = 'left';
      RPM_TICKS.forEach(function(pair) {
        var rpmVal = pair[0], label = pair[1];
        var frac = rpmVal / RPM_MAX;
        var y = TOP_PAD + drawH * (1 - frac);
        var active = rpmVal <= rpm;
        var isRedline = rpmVal >= 6000;

        ctx.strokeStyle = active ? (isRedline ? '#ff2020' : '#F16666') : '#3a4555';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(barX + barW + 2, y);
        ctx.lineTo(barX + barW + 2 + 18, y);
        ctx.stroke();

        if (label) {
          ctx.font = '11px Arial';
          ctx.fillStyle = active ? (isRedline ? '#ff2020' : '#F16666') : '#3a4555';
          ctx.fillText(label, barX + barW + 2 + 18 + 4, y + 4);
        }
      });

      // "READY" label at bottom when rpm == 0
      if (rpm < 200) {
        ctx.font = '10px Arial';
        ctx.fillStyle = '#a2abbb';
        ctx.textAlign = 'left';
        ctx.fillText('RDY', barX + barW + 2 + 18 + 4, TOP_PAD + drawH + 4);
      }

      // Large RPM value (in thousands, 1 decimal)
      var rpmK = (rpm / 1000).toFixed(1);
      ctx.textAlign = 'center';
      ctx.font = 'bold 54px Arial';
      ctx.fillStyle = redline ? '#ff4040' : '#F16666';
      ctx.fillText(rpmK, W - 84, H / 2 + 10);

      // "rpm ×1k" unit label
      ctx.font = '13px Arial';
      ctx.fillStyle = '#a2abbb';
      ctx.fillText('rpm ×1k', W - 84, H / 2 + 32);

      // "RPM" header
      ctx.font = 'bold 11px Arial';
      ctx.fillStyle = '#a2abbb';
      ctx.fillText('RPM', W - 84, TOP_PAD - 14);
    }

    function updateClock() {
      var now = new Date();
      var h = now.getHours(), m = now.getMinutes();
      document.getElementById('bottom-clock').textContent =
        (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }

    function updateGauges(data) {
      var speed = data.speed_kph !== undefined ? data.speed_kph : 0;
      var rpm   = data.rpm       !== undefined ? data.rpm       : 0;
      var clt   = data.clt_c    !== undefined ? data.clt_c    : 0;
      drawSpeedCanvas(speed);
      drawRpmCanvas(rpm);
      document.getElementById('bottom-speed').textContent = Math.round(speed);
      document.getElementById('bottom-temp').textContent  = Math.round(clt);
      updateClock();
    }

    // Draw initial (zeroed) gauges on load
    window.addEventListener('load', function() {
      drawSpeedCanvas(0);
      drawRpmCanvas(0);
      updateClock();
      setInterval(updateClock, 10000);
    });

    // ------------------------------------------------------------------ GPS bridge
    new QWebChannel(qt.webChannelTransport, function(channel) {
      gpsChannel = channel;
      channel.objects.gps.position_changed.connect(function(json) {
        var data = JSON.parse(json);
        document.getElementById('no-fix').classList.toggle('visible', !data.fix);
        // Update gauges regardless of GPS fix (ECU data is independent)
        updateGauges(data);
        if (!data.fix) return;
        lastPos = data;
        if (mapReady) {
          applyPosition(data);
          if (routeSteps.length) updateTurnBanner(data);
        }
      });
    });

    // ------------------------------------------------------------------ apply GPS
    function applyPosition(data) {
      map.setHeading(data.heading);
      map.setCenter(offsetForward({ lat: data.lat, lng: data.lon }, data.heading, forwardMeters()));
    }

    // ------------------------------------------------------------------ home
    function goHome() {
      if (gpsChannel) {
        gpsChannel.objects.gps.go_home();
      }
    }

    // ------------------------------------------------------------------ search
    function openSearch() {
      document.getElementById('search-panel').classList.add('visible');
      document.getElementById('search-btn').style.display = 'none';
    }

    function closeSearch() {
      document.getElementById('search-panel').classList.remove('visible');
      if (!routeSteps.length) document.getElementById('search-btn').style.display = 'flex';
      document.getElementById('search-input').value = '';
    }

    async function doSearch() {
      var query = document.getElementById('search-input').value.trim();
      if (!query) return;
      if (!lastPos) {
        document.getElementById('search-input').placeholder = 'No GPS fix yet — try again';
        document.getElementById('search-input').value = '';
        return;
      }
      var btn = document.getElementById('search-go');
      btn.textContent = '…';
      btn.disabled = true;

      var dbg = document.getElementById('search-input');
      try {
        // 1. Find place via Places API (New) REST
        var destLatLng = null;
        var placeResp = await fetch('https://places.googleapis.com/v1/places:searchText', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Goog-Api-Key': MAPS_KEY,
            'X-Goog-FieldMask': 'places.location,places.displayName',
          },
          body: JSON.stringify({
            textQuery: query,
            locationBias: { circle: {
              center: { latitude: lastPos.lat, longitude: lastPos.lon },
              radius: 50000,
            }},
          }),
        });
        var placeData = await placeResp.json();
        if (placeData.places && placeData.places.length) {
          var loc = placeData.places[0].location;
          destLatLng = { latitude: loc.latitude, longitude: loc.longitude };
        } else {
          throw new Error('Place not found. Try a street address.');
        }

        // 2. Compute route via Routes API (New)
        var resp = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Goog-Api-Key': MAPS_KEY,
            'X-Goog-FieldMask': 'routes.duration,routes.polyline.encodedPolyline,routes.legs.steps.navigationInstruction.instructions,routes.legs.steps.navigationInstruction.maneuver,routes.legs.steps.endLocation',
          },
          body: JSON.stringify({
            origin: { location: { latLng: { latitude: lastPos.lat, longitude: lastPos.lon } } },
            destination: { location: { latLng: destLatLng } },
            travelMode: 'DRIVE',
            languageCode: 'es',
            units: 'METRIC',
          }),
        });
        var data = await resp.json();

        if (!data.routes || !data.routes.length) {
          throw new Error('No route found.');
        }

        // 3. Draw polyline
        if (routePolyline) routePolyline.setMap(null);
        var path = google.maps.geometry.encoding.decodePath(data.routes[0].polyline.encodedPolyline);
        routePolyline = new google.maps.Polyline({
          path: path, map: map,
          strokeColor: '#4A90E2', strokeWeight: 6, strokeOpacity: 0.85,
        });

        // 4. Extract steps and ETA
        routeSteps = (data.routes[0].legs[0].steps || []).map(function(s) {
          return {
            endLat: s.endLocation.latLng.latitude,
            endLng: s.endLocation.latLng.longitude,
            instruction: s.navigationInstruction ? s.navigationInstruction.instructions : '',
            maneuver: s.navigationInstruction ? s.navigationInstruction.maneuver : 'STRAIGHT',
          };
        });
        var durationSec = parseInt(data.routes[0].duration);
        routeEta = new Date(Date.now() + durationSec * 1000);

        document.getElementById('search-btn').style.display = 'none';
        closeSearch();
        if (lastPos) updateTurnBanner(lastPos);

      } catch (e) {
        dbg.value = '';
        dbg.placeholder = 'ERROR: ' + e.message;
      }

      btn.textContent = 'Go';
      btn.disabled = false;
    }

    // ------------------------------------------------------------------ on-screen keyboard
    function oskKey(ch) { document.getElementById('search-input').value += ch; }
    function oskBackspace() {
      var el = document.getElementById('search-input');
      el.value = el.value.slice(0, -1);
    }

    // ------------------------------------------------------------------ routing
    function cancelRoute() {
      if (routePolyline) { routePolyline.setMap(null); routePolyline = null; }
      routeSteps = [];
      routeEta = null;
      document.getElementById('turn-banner').classList.remove('visible');
      document.getElementById('search-btn').style.display = 'flex';
    }

    // ------------------------------------------------------------------ turn banner
    function updateTurnBanner(data) {
      if (!routeSteps.length) return;
      var nearestIdx = 0, minDist = Infinity;
      for (var i = 0; i < routeSteps.length; i++) {
        var d = haversine(data.lat, data.lon, routeSteps[i].endLat, routeSteps[i].endLng);
        if (d < minDist) { minDist = d; nearestIdx = i; }
      }
      var step = routeSteps[nearestIdx];
      var distText = minDist >= 1000
        ? (minDist / 1000).toFixed(1) + ' km' : Math.round(minDist) + ' m';
      document.getElementById('turn-instruction').textContent = step.instruction;
      document.getElementById('turn-maneuver').innerHTML = maneuverIcon(step.maneuver);
      document.getElementById('turn-distance').textContent = distText;
      if (routeEta) {
        var h = routeEta.getHours(), m = routeEta.getMinutes();
        document.getElementById('turn-eta').textContent =
          'ETA ' + h + ':' + (m < 10 ? '0' : '') + m;
      }
      document.getElementById('turn-banner').classList.add('visible');
    }

    // ------------------------------------------------------------------ maneuver icon
    function maneuverIcon(maneuver) {
      var d = {
        'STRAIGHT':          'M12 4 L12 20 M8 8 L12 4 L16 8',
        'TURN_LEFT':         'M18 18 L18 10 Q18 6 14 6 L8 6 M12 10 L8 6 L12 2',
        'TURN_SLIGHT_LEFT':  'M18 18 L18 10 Q16 4 10 6 L6 8 M10 4 L6 8 L10 12',
        'TURN_SHARP_LEFT':   'M18 18 L18 12 L8 12 L8 6 M4 10 L8 6 L12 10',
        'TURN_RIGHT':        'M6 18 L6 10 Q6 6 10 6 L16 6 M12 10 L16 6 L12 2',
        'TURN_SLIGHT_RIGHT': 'M6 18 L6 10 Q8 4 14 6 L18 8 M14 4 L18 8 L14 12',
        'TURN_SHARP_RIGHT':  'M6 18 L6 12 L16 12 L16 6 M12 10 L16 6 L20 10',
        'UTURN_LEFT':        'M16 18 L16 10 Q16 4 10 4 Q4 4 4 10 L4 14 M8 10 L4 14 L8 18',
        'UTURN_RIGHT':       'M8 18 L8 10 Q8 4 14 4 Q20 4 20 10 L20 14 M16 10 L20 14 L16 18',
        'ROUNDABOUT_LEFT':   'M12 4 A8 8 0 1 0 4 12 M4 12 L4 8 M4 12 L8 12',
        'ROUNDABOUT_RIGHT':  'M12 4 A8 8 0 1 1 20 12 M20 12 L20 8 M20 12 L16 12',
        'FORK_LEFT':         'M12 20 L12 12 L8 4 M12 12 L16 4',
        'FORK_RIGHT':        'M12 20 L12 12 L16 4 M12 12 L8 4',
        'DEPART':            'M12 4 L12 20 M8 8 L12 4 L16 8',
        'DESTINATION':       'M12 2 A5 5 0 0 1 12 12 A5 5 0 0 1 12 2 M12 12 L12 20',
      };
      var path = d[maneuver] || d['STRAIGHT'];
      return '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a2abbb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="' + path + '"/></svg>';
    }

    // ------------------------------------------------------------------ math helpers
    function haversine(lat1, lon1, lat2, lon2) {
      var R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function offsetForward(pos, heading, meters) {
      var R = 6371000, h = heading*Math.PI/180;
      var lat1 = pos.lat*Math.PI/180, lon1 = pos.lng*Math.PI/180, d = meters/R;
      var lat2 = Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(h));
      var lon2 = lon1+Math.atan2(Math.sin(h)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
      return { lat: lat2*180/Math.PI, lng: lon2*180/Math.PI };
    }

    function forwardMeters() {
      var zoom = map ? map.getZoom() : 17, lat = map ? map.getCenter().lat() : 0;
      return 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,zoom) * (window.innerHeight/6);
    }
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key={{API_KEY}}&libraries=places,geometry&callback=initMap&loading=async"
    async defer>
  </script>
