<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Navigation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* Vehicle icon — fixed at horizontal center, vertical bottom-third */
    #vehicle {
      position: fixed;
      left: 50%;
      top: 66.6%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 10;
    }
    #vehicle svg {
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
    }

    /* No-fix overlay */
    #no-fix {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      color: #EBB32B;
      font: bold 1.2rem 'Arial', sans-serif;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.15em;
      z-index: 20;
    }
    #no-fix.visible { display: flex; }

    /* Speed badge */
    #speed {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font: bold 2rem 'Arial', sans-serif;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #EBB32B;
      z-index: 15;
    }

    /* Search button */
    #search-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.65);
      border: 1px solid #EBB32B;
      border-radius: 50%;
      color: #EBB32B;
      font-size: 22px;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Search panel */
    #search-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.92);
      padding: 14px;
      z-index: 30;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #EBB32B;
    }
    #search-panel.visible { display: flex; }
    #search-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: #fff;
      outline: none;
    }
    #search-input:focus { border-color: #EBB32B; }
    #search-go {
      padding: 10px 18px;
      background: #EBB32B;
      color: #000;
      border: none;
      border-radius: 6px;
      font: bold 1rem 'Arial', sans-serif;
      cursor: pointer;
    }
    #search-close {
      padding: 10px 14px;
      background: none;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Turn banner */
    #turn-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font: bold 1.1rem 'Arial', sans-serif;
      padding: 14px 16px;
      z-index: 15;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #EBB32B;
    }
    #turn-banner.visible { display: flex; }
    #turn-instruction { flex: 1; }
    #turn-distance { color: #EBB32B; white-space: nowrap; font-size: 1.2rem; }
    #cancel-route {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Amber arrow — always pointing up since map rotates to heading-up -->
  <div id="vehicle">
    <svg width="36" height="48" viewBox="0 0 36 48">
      <polygon points="18,0 36,48 18,36 0,48" fill="#EBB32B" stroke="#000" stroke-width="1.5"/>
    </svg>
  </div>

  <div id="no-fix">NO GPS FIX</div>
  <div id="speed">-- km/h</div>

  <!-- Search button (hidden while routing) -->
  <button id="search-btn" onclick="openSearch()">&#9906;</button>

  <!-- Search panel -->
  <div id="search-panel">
    <input id="search-input" type="text" placeholder="Search destination…" autocomplete="off"/>
    <button id="search-go" onclick="doSearch()">Go</button>
    <button id="search-close" onclick="closeSearch()">&#x2715;</button>
  </div>

  <!-- Turn-by-turn banner -->
  <div id="turn-banner">
    <span id="turn-instruction"></span>
    <span id="turn-distance"></span>
    <button id="cancel-route" onclick="cancelRoute()">&#x2715; End</button>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    var map;
    var lastPos = null;
    var mapReady = false;
    var directionsService, directionsRenderer;
    var routeSteps = [];
    var autocomplete;

    // ------------------------------------------------------------------ map init
    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 17,
        center: { lat: 0, lng: 0 },
        mapTypeId: 'roadmap',
        disableDefaultUI: true,
        gestureHandling: 'none',
        keyboardShortcuts: false,
        backgroundColor: '#1a1a1a',
        styles: [
          { featureType: 'poi', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit', stylers: [{ visibility: 'off' }] },
          { elementType: 'labels.icon', stylers: [{ visibility: 'off' }] }
        ]
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map: map,
        suppressMarkers: false,
        polylineOptions: {
          strokeColor: '#4A90E2',
          strokeWeight: 6,
          strokeOpacity: 0.85,
        }
      });

      autocomplete = new google.maps.places.Autocomplete(
        document.getElementById('search-input'),
        { types: ['geocode', 'establishment'] }
      );
      autocomplete.addListener('place_changed', function() {
        var place = autocomplete.getPlace();
        if (place && place.geometry) {
          requestRoute(place.geometry.location);
          closeSearch();
        }
      });

      mapReady = true;
      if (lastPos) applyPosition(lastPos);
    }

    // ------------------------------------------------------------------ GPS bridge
    new QWebChannel(qt.webChannelTransport, function(channel) {
      channel.objects.gps.position_changed.connect(function(json) {
        var data = JSON.parse(json);
        document.getElementById('no-fix').classList.toggle('visible', !data.fix);
        document.getElementById('speed').textContent =
          data.fix ? Math.round(data.speed) + ' km/h' : '-- km/h';

        if (!data.fix) return;

        lastPos = data;
        if (mapReady) {
          applyPosition(data);
          if (routeSteps.length) updateTurnBanner(data);
        }
      });
    });

    // ------------------------------------------------------------------ apply GPS
    function applyPosition(data) {
      var pos = { lat: data.lat, lng: data.lon };
      map.setHeading(data.heading);
      var center = offsetForward(pos, data.heading, forwardMeters());
      map.setCenter(center);
    }

    // ------------------------------------------------------------------ search
    function openSearch() {
      document.getElementById('search-panel').classList.add('visible');
      document.getElementById('search-btn').style.display = 'none';
      setTimeout(function() { document.getElementById('search-input').focus(); }, 100);
    }

    function closeSearch() {
      document.getElementById('search-panel').classList.remove('visible');
      document.getElementById('search-btn').style.display = 'flex';
      document.getElementById('search-input').value = '';
    }

    function doSearch() {
      var query = document.getElementById('search-input').value.trim();
      if (!query) return;
      var geocoder = new google.maps.Geocoder();
      geocoder.geocode({ address: query }, function(results, status) {
        if (status === 'OK' && results.length) {
          requestRoute(results[0].geometry.location);
          closeSearch();
        } else {
          document.getElementById('search-input').placeholder = 'Place not found — try again';
        }
      });
    }

    // Enter key triggers search
    document.getElementById('search-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSearch();
    });

    // ------------------------------------------------------------------ routing
    function requestRoute(destination) {
      if (!lastPos) return;
      var origin = new google.maps.LatLng(lastPos.lat, lastPos.lon);
      directionsService.route({
        origin: origin,
        destination: destination,
        travelMode: google.maps.TravelMode.DRIVING,
      }, function(result, status) {
        if (status === 'OK') {
          directionsRenderer.setDirections(result);
          routeSteps = result.routes[0].legs[0].steps;
          document.getElementById('search-btn').style.display = 'none';
          if (lastPos) updateTurnBanner(lastPos);
        }
      });
    }

    function cancelRoute() {
      directionsRenderer.setMap(null);
      directionsRenderer.setMap(map);
      routeSteps = [];
      document.getElementById('turn-banner').classList.remove('visible');
      document.getElementById('search-btn').style.display = 'flex';
    }

    // ------------------------------------------------------------------ turn banner
    function updateTurnBanner(data) {
      if (!routeSteps.length) return;

      var nearestIdx = 0;
      var minDist = Infinity;
      for (var i = 0; i < routeSteps.length; i++) {
        var sl = routeSteps[i].start_location;
        var d = haversine(data.lat, data.lon, sl.lat(), sl.lng());
        if (d < minDist) { minDist = d; nearestIdx = i; }
      }

      var step = routeSteps[nearestIdx];
      var distToEnd = haversine(data.lat, data.lon, step.end_location.lat(), step.end_location.lng());
      var instructions = step.instructions.replace(/<[^>]+>/g, '');
      var distText = distToEnd >= 1000
        ? (distToEnd / 1000).toFixed(1) + ' km'
        : Math.round(distToEnd) + ' m';

      document.getElementById('turn-instruction').textContent = instructions;
      document.getElementById('turn-distance').textContent = distText;
      document.getElementById('turn-banner').classList.add('visible');
    }

    // ------------------------------------------------------------------ math helpers
    function haversine(lat1, lon1, lat2, lon2) {
      var R = 6371000;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function offsetForward(pos, heading, meters) {
      var R = 6371000;
      var h = heading * Math.PI / 180;
      var lat1 = pos.lat * Math.PI / 180;
      var lon1 = pos.lng * Math.PI / 180;
      var d = meters / R;
      var lat2 = Math.asin(
        Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(h)
      );
      var lon2 = lon1 + Math.atan2(
        Math.sin(h) * Math.sin(d) * Math.cos(lat1),
        Math.cos(d) - Math.sin(lat1) * Math.sin(lat2)
      );
      return { lat: lat2 * 180 / Math.PI, lng: lon2 * 180 / Math.PI };
    }

    function forwardMeters() {
      var zoom = map ? map.getZoom() : 17;
      var lat  = map ? map.getCenter().lat() : 0;
      var metersPerPx = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
      return metersPerPx * (window.innerHeight / 6);
    }
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key={{API_KEY}}&libraries=places&callback=initMap"
    async defer>
  </script>
</body>
</html>
